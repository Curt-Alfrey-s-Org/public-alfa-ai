<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance — USPBF</title>
    <style>
        :root {
            --uspbf-slate-from: #0f172a;
            --uspbf-slate-to: #1e293b;
            --uspbf-surface: rgba(30, 41, 59, 0.8);
            --uspbf-border-slate: rgba(71, 85, 105, 0.5);
            --uspbf-sky: #38bdf8;
            --uspbf-sky-strong: #0ea5e9;
            --uspbf-gold: #c9a227;
            --uspbf-text: #e2e8f0;
            --uspbf-muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: linear-gradient(135deg, var(--uspbf-slate-from) 0%, var(--uspbf-slate-to) 100%);
            color: var(--uspbf-text);
            padding: 1.5rem;
        }
        .card {
            max-width: 28rem;
            text-align: center;
            padding: 2.5rem;
            background: var(--uspbf-surface);
            border-radius: 1rem;
            border: 1px solid var(--uspbf-border-slate);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            border-top: 3px solid var(--uspbf-sky-strong);
        }
        .org {
            margin: 0 0 0.75rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--uspbf-gold);
            font-weight: 600;
        }
        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--uspbf-text);
        }
        .lead {
            margin: 0;
            color: var(--uspbf-muted);
            line-height: 1.6;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--uspbf-muted);
        }
        .footer a {
            color: var(--uspbf-sky);
            text-decoration: none;
        }
        .footer a:hover {
            color: var(--uspbf-sky-strong);
            text-decoration: underline;
        }
    </style>
    <link rel="stylesheet" href="/css/alfa-demo-chat.css?v=1">
</head>
<body>
    <div class="card">
        <p class="org">United States Pro Billiards Federation</p>
        <h1>Under Maintenance</h1>
        <p class="lead">We&rsquo;re updating the site. Ask ALFa about USPBF and Pro Billiards Software using the chat below.</p>
    </div>
    <p class="footer">
        Powered by <a href="https://www.probilliardssoftware.com/" target="_blank" rel="noopener noreferrer">Pro Billiards Software</a>
    </p>
    <script src="/js/api.js"></script>
    <script src="/js/alfa-demo-chat.js?v=6"></script>
</body>
</html>

# Alfa Nginx — www.example.com + bot subdomains.
# Served behind Cloudflare Tunnel (cf-alfa). No origin TLS; tunnel sends HTTP.
# Container must be on tunnel_network; cf-alfa routes to http://alfa-nginx:80.
#
# Uses Docker embedded DNS (127.0.0.11) for runtime resolution so nginx can start
# before backends are up. Per DOCKER_NETWORK_CONSTANTS.md.

resolver 127.0.0.11 valid=10s ipv6=off;

# ---------------------------------------------------------------------------
# Main alfa site (WordPress)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.example.com example.com;

    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto) {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    access_log /var/log/nginx/alfa-wp-access.log;
    error_log /var/log/nginx/alfa-wp-error.log;

    client_max_body_size 50M;

    # ALFa AI chat web app — proxied to the inference edge (Jul 2026 hub migration
    # off apps; brain lives on hub). alfa-ai-api:8000 was a same-host Docker
    # service name that stopped resolving once the edge container moved to a
    # different host — Docker embedded DNS cannot resolve container names
    # across hosts. See docs/DOCKGE_105_OPERATOR.md "Edge moved to inference".
    location /alfa-ai {
        set $backend_ai orchestrator;
        proxy_pass http://$backend_ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        set $backend_wp alfa_wordpress_1:80;
        proxy_pass http://$backend_wp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# ---------------------------------------------------------------------------
# Rankings Bot subdomain (rankings-bot-api serves combined API + frontend)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name rankings-bot.example.com;

    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto) {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    access_log /var/log/nginx/rankings-bot-alfa-access.log;
    error_log /var/log/nginx/rankings-bot-alfa-error.log;

    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml;

    location /api/ {
        set $backend_rb rankings-bot-api:8003;
        proxy_pass http://$backend_rb/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        set $backend_rb rankings-bot-api:8003;
        proxy_pass http://$backend_rb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        error_page 404 =200 /index.html;
    }
}


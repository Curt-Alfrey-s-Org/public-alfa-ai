# ---------------------------------------------------------------------------
# Alfa Business Suite subdomain (multi-tenant SaaS; stack on biz)
# Cloudflare Tunnel public hostname → alfa-nginx:80
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name alfa-business-suite.example.com;

    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto) {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    access_log /var/log/nginx/alfa-business-suite-access.log;
    error_log /var/log/nginx/alfa-business-suite-error.log;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml;

    # API direct (preserve real 404s). Suite on host biz — bind api to 0.0.0.0:8000.
    location /api/ {
        set $backend_abs_api orchestrator;
        proxy_pass http://$backend_abs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # OpenAPI / docs (optional)
    location /docs {
        set $backend_abs_api orchestrator;
        proxy_pass http://$backend_abs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /openapi.json {
        set $backend_abs_api orchestrator;
        proxy_pass http://$backend_abs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Web UI on biz:5173 (suite web container). Bind web to 0.0.0.0:5173.
    location / {
        set $backend_abs_web orchestrator;
        proxy_pass http://$backend_abs_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}


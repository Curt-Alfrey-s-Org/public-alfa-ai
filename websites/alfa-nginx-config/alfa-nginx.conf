# ---------------------------------------------------------------------------
# Health check (for Docker HEALTHCHECK)
# ---------------------------------------------------------------------------
server {
    listen 8080;
    server_name localhost;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

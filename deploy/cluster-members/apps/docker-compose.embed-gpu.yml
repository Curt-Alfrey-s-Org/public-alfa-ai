# apps apps host -- GPU Ollama sidecar for qwen3-embedding:4b (Phase E1).
# Binds GTX 1660 Super for embed workloads (:11435).
#
# Usage (on apps):
#   bash deploy/cluster-members/apps/deploy-rag-embed.sh
#
# LiteLLM on hub: EMBED_BASE_URL=http://apps

services:
  alfa-ai-embed-ollama:
    image: ollama/ollama:0.35.1
    container_name: alfa-ai-embed-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_GPU=1
    volumes:
      - ${OLLAMA_EMBED_MODELS_DIR:-/mnt/cluster/models/ollama-embed}:/root/.ollama
    ports:
      - "11435:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

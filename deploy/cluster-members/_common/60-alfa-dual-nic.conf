# ALFa dual-NIC same-subnet ARP flux fix (installed to /etc/sysctl.d/60-alfa-dual-nic.conf).
# When a host has two NICs on the same /24 (mgmt + data plane), the default arp_ignore=0 lets
# every NIC answer ARP for any local IP, so the switch CAM table flips between MACs (ARP flux),
# intermittently breaking LAN reachability. arp_ignore=1 makes each NIC answer ARP only for IPs
# configured on that NIC; arp_announce=2 sources ARP from the best-matching local address.
# Ref: https://www.kernel.org/doc/Documentation/networking/ip-sysctl.txt (arp_ignore, arp_announce)
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2

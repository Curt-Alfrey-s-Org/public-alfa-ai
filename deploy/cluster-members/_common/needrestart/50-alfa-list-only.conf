# ALFa: list-only after library updates. Do not auto-restart services.
# Official Ubuntu Automatic updates (Service restarts):
# https://ubuntu.com/server/docs/how-to/software/automatic-updates/
# Drop-in under /etc/needrestart/conf.d/ as documented on that page.
#
# Vendor default is interactive, which falls back to list-only when
# non-interactive (unattended-upgrades). Pin 'l' so a future package default
# of 'a' cannot restart docker or other production units mid-pool.
#
# Restart mode: (l)ist only, (i)nteractive, (a)utomatically.

$nrconf{restart} = 'l';

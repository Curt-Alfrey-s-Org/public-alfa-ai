# Dockge -- Docker Compose stack manager (primary UI on orchestrator operator-93, agent on every other node).
# https://github.com/louislam/dockge
#
# Requires a sibling .env file (generated by deploy scripts) with:
#   DOCKGE_HOST_PORT=5002
#   DOCKGE_DATA_HOST=<absolute host path for Dockge app data>
#   DOCKGE_STACKS_HOST=<absolute host path: parent of stack folders>
#
# Inside the container stacks live at DOCKGE_STACKS_DIR=/opt/stacks (fixed).
# On Windows (Docker Desktop), use forward slashes or escaped paths in .env.
name: alfa-dockge

services:
  dockge:
    image: louislam/dockge:1
    container_name: alfa-dockge
    restart: unless-stopped
    ports:
      - "${DOCKGE_HOST_PORT:-5002}:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKGE_DATA_HOST}:/app/data
      - ${DOCKGE_STACKS_HOST}:/opt/stacks
    environment:
      - DOCKGE_STACKS_DIR=/opt/stacks

# VM100 — GPU Ollama sidecar for qwen3-embedding:4b (Track B).
# Replaces apps-105/docker-compose.embed-gpu.yml after 1660S moves to VM100.
#
# Usage:
#   bash deploy/cluster-members/pool-shard-opt-in/deploy-embed.sh
#
# LiteLLM on hub: EMBED_BASE_URL=http://orchestrator

services:
  alfa-ai-embed-ollama:
    image: ollama/ollama:0.35.1
    container_name: alfa-ai-embed-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_GPU=1
      # Mandatory RAG is on the critical path for every retrieval-augmented
      # request; the default 5m idle unload cost a measured ~48s cold reload
      # on the next embed call. Never unload. Official docs:
      # https://github.com/ollama/ollama/blob/main/docs/faq.md#how-can-i-keep-a-model-loaded-or-unload-it-immediately
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ${OLLAMA_EMBED_MODELS_DIR:-/mnt/cluster/models/ollama-embed}:/root/.ollama
    ports:
      - "11435:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
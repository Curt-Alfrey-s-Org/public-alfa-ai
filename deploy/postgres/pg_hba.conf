# ALFa AI brain Postgres — audit PG-004 / backlog #22.
# Mounted read-only; postgres started with -c hba_file=/etc/postgresql/pg_hba.conf
#
# Trust only Unix-socket peers inside the container; require SCRAM for all TCP
# (Docker bridge + loopback). TLS termination is upstream (not required on the
# internal bridge when traffic stays on alfa-ai-network).
#
# Both IPv4 and IPv6 wildcard rules are required: Docker's embedded DNS returns
# A + AAAA records for service names on user-defined networks, and Rust-based
# clients (e.g. LiteLLM's Prisma engine via tokio-postgres) frequently connect
# via the AAAA result. Missing `::/0` here surfaces as Prisma P1010 with
# "denied access on the database" — actually an hba-match FATAL in postgres logs.

local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256

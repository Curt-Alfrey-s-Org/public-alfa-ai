general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"

  # --- Health-check-driven routing for partial-cluster operation --------------
  # Background loop pings every deployment every health_check_interval seconds.
  # Any deployment that fails its check is removed from the routing pool
  # *before* user requests can land on it -- proactive, not reactive. Combined
  # with the cooldown/fallback config in router_settings, this makes routing
  # robust against the orchestrator/gaming-c/gaming-b-offline failure mode observed during the
  # per-host build phase (silent-dropping or RST-rejecting siblings poison the
  # LB fan-out and exhaust the retry budget before reaching the healthy hub).
  # As fleet hosts come online they self-heal via the next health-check cycle.
  # See https://docs.litellm.ai/docs/proxy/health_check_routing
  background_health_checks: true
  health_check_interval: 60                    # seconds between full cycles
  enable_health_check_routing: true            # actually route away from unhealthy
  health_check_ignore_transient_errors: true   # 429/408 don't poison routing
  # One worker runs the health-check cycle; the rest read the shared Redis result.
  # Avoids N-worker probe fan-out against the single-client llama.cpp RPC pool.
  # Requires LiteLLM >= v1.90 (image pinned in docker-compose.yml).
  # See https://docs.litellm.ai/docs/proxy/shared_health_check
  use_shared_health_check: true

litellm_settings:
  # Keep enable_thinking / chat_template_kwargs / think from ALFa API and clients.
  drop_params: false
  set_verbose: false
  request_timeout: 600
  num_retries: 1
  # Phase F1: Redis response cache (alfa-ai-redis on the brain compose network).
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    ttl: 3600
    supported_call_types:
      - acompletion
      - aembedding

router_settings:
  # Whole-call cap at router level (docs.litellm.ai/docs/proxy/timeout).
  timeout: 900
  # Redact internal model_group/fallback alias names from client-visible error
  # bodies (public-surface-security.mdc). Requires LiteLLM >= v1.90.
  # See https://docs.litellm.ai/release_notes/v1.90.0/v1-90-0
  expose_router_debug_in_errors: false
  # Latency-based routing prefers the backend that responded fastest recently.
  # 2026-06-17: each CPU chat alias now has a SINGLE primary deployment (orchestrator MoE
  # for speed aliases, gaming-c dense for quality aliases); cross-host + frontier
  # resilience is handled by `fallbacks` below, not by duplicate model_name rows.
  # Per LiteLLM docs (Routing), routing_strategy must live under `router_settings:`
  # — under `litellm_settings:` it is silently ignored (round-robin fallback).
  # Applies to multi-deployment names when present. Single-row aliases use that deployment directly.
  # See https://docs.litellm.ai/docs/routing
  routing_strategy: "latency-based-routing"

  # --- Fast-fail cooldowns for partial-cluster operation -----------------------
  # If a primary CPU chat host (orchestrator or gaming-c) is down or warming a model, the
  # default allowed_fails=3 would let requests hang on the dead host before
  # sidelining. With allowed_fails=1, cooldown triggers when updated_fails > 1
  # (2nd failure in window), not on the first fail (LiteLLM routing docs).
  # See https://docs.litellm.ai/docs/routing#advanced---cooldown-deployments
  cooldown_time: 120          # seconds to sideline a deployment after failure
                              # (must be > general_settings.health_check_interval per LiteLLM docs)
  allowed_fails: 1            # cooldown when consecutive fails exceed this count

  allowed_fails_policy:
    TimeoutErrorAllowedFails: 3
    RateLimitErrorAllowedFails: 2
    InternalServerErrorAllowedFails: 2

  retry_policy:
    RateLimitErrorRetries: 0

  # --- Fallbacks: graceful degradation (G-rev) -----------------------------
  # Speed aliases fall back to frontier-code (hub :31360).
  # In inference production use litellm_config.inference.yaml (no speed-tier rows).
  fallbacks:
    - fast: ["frontier-code"]
    - inline: ["frontier-code"]
    - autocomplete: ["frontier-code"]
    - chat: ["frontier-code"]
    - public-chat: ["frontier-code"]
    - app-chat: ["frontier-code"]
    - agent: ["frontier-code"]
    - code: ["frontier-code"]
    - operator_internal: ["frontier-code"]
    - frontier: ["frontier-code"]
    - frontier-code: []
    # Optional when 122B Chat profile is loaded:
    # - frontier: ["qwen3.5-122b-a10b"]

# Stand-alone Redis for the apps apps host — referenced by
# deploy/cluster-members/apps/stacksapps.yml (stack `redis`).
#
# Resolves audit finding CROSS-105-001 (docs/audit/audit-findings.md): previously
# stacksapps.yml referenced this file but it did not exist.
#
# Posture intentionally mirrors the brain stack redis in deploy/docker-compose.yml.
# Image is pinned to redis:7.4-alpine per audit REDIS-001 (≥ 7.2.14 security floor).
# Hardened in audit backlog #10 (REDIS-002/003): requirepass + maxmemory +
# allkeys-lru eviction policy.
#
# Environment file (operator-managed, gitignored): deploy/.env.apps
# Live env: deploy/cluster-members/apps/.env.apps (gitignored on apps host).

name: redis

services:
  alfa-redis:
    image: redis:7.4-alpine
    container_name: alfa-redis
    runtime: runc
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?required - set REDIS_PASSWORD in deploy/.env.apps (audit REDIS-002)}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      # Supports bind on fast pool (e.g. hub SSD) or named volume (default apps).
      # Set ALFA_REDIS_DATA_PATH=/mnt/ssd/... in the stack's env to attach existing data dir.
      - ${ALFA_REDIS_DATA_PATH:-alfa-redis-data}:/data
    ports:
      # Loopback for host-network exporters on hub (hub-*-exporter-brain).
      # LAN publish: merge docker-compose.redis.lan-bind.yml (see open_lan_db_for_workers.sh).
      - "127.0.0.1:${ALFA_AI_REDIS_HOST_PORT:-6390}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required - set REDIS_PASSWORD in deploy/.env.apps (audit REDIS-002)}
    networks:
      - shared

volumes:
  alfa-redis-data:

# Shared network for DB <-> consumers (api, litellm, workers, site ngnixes).
# - Default: alfa-shared-network (used on apps apps host; must exist as external).
# - On hub brain: set ALFA_SHARED_DOCKER_NETWORK=alfa-ai-network in deploy/.env
#   so dedicated DBs join the same bridge as brain services for DNS resolution
#   (alfa-postgres / alfa-redis hostnames from DATABASE_URL etc.).
# The network must be created before `up` of the dedicated stack.
networks:
  shared:
    name: ${ALFA_SHARED_DOCKER_NETWORK:-alfa-shared-network}
    external: true

# LiteLLM — 35B MoE pool production overlay (pool35 mode)
#
# Activated when brain deploy/.env sets LITELLM_CONFIG=litellm_config.pool35.yaml
# (switch-pool-35b.sh). Omits dead 27B/Petals tiers while 35B RPC pool is active.
#
# SSoT: docs/GREV35_35B_OPERATOR.md Phase 5

model_list:
  - model_name: "fast"
    litellm_params:
      model: "openai/qwen3.6-35b-a3b"
      api_base: "os.environ/LLAMACPP_35B_URL"
      api_key: "change-me"
      timeout: 1200
      stream_timeout: 120
      request_timeout: 1200
    model_info:
      supports_reasoning: true
      disable_background_health_check: true

  - model_name: "inline"

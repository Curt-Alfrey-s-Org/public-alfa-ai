  # -- Universal alias coverage (see docs/POOL_SWITCH_OPERATOR.md) -------------
  # contracts-bot (and anything else asking for the 27B-named aliases) still
  # gets a working answer -- routed to the live 35B model -- while pool35 is
  # the active pool, instead of "Invalid model name".

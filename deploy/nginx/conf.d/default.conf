# Brain reverse proxy (audit NGINX-002–005 / backlog #19).
# Included inside nginx `http { }`; uses Docker DNS for alfa-ai-api.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

log_format alfa '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    '$request_time $upstream_response_time $upstream_addr';

upstream alfa_ai_api {
    server alfa-ai-api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name www.example.com example.com alfa-ai-nginx localhost 127.0.0.1 "~^[0-9]{1,3}(\.[0-9]{1,3}){3}$";

    access_log /var/log/nginx/access.log alfa;

    # Security headers (inherited by all locations below — none define their own
    # add_header). https://nginx.org/en/docs/http/ngx_http_headers_module.html
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        # No URI on proxy_pass — keep /api/... so FastAPI /api/runs* is not stripped to /runs.
        # https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_pass
        proxy_pass http://alfa_ai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /health {
        proxy_pass http://alfa_ai_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /admin/ {
        proxy_pass http://alfa_ai_api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log alfa;
    return 444;
}

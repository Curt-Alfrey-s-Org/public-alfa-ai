# contracts-bot-edge.conf — inference /LAN proxy to contracts-bot on apps
# Host publish :8422 -> container :8000 -> http://apps/
# HTTP only (same pattern as alfa-ai-edge :8420). Do not enable TLS here.
# Official  CGNAT: https://.com/docs/concepts/-ip-addresses

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

upstream contracts_bot_105 {
    server apps;
    keepalive 16;
}

server {
    listen 8000;
    server_name _;

    access_log /var/log/nginx/contracts-bot-edge-access.log;
    error_log  /var/log/nginx/contracts-bot-edge-error.log;

    location / {
        proxy_pass http://contracts_bot_105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # First hop = /LAN client (admin CIDR on contracts-bot API).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

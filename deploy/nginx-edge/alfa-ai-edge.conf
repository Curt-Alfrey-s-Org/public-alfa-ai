# alfa-ai-edge.conf — inference hub edge proxy to the brain on hub (hub).
# Container listens on :8000 so site nginx can proxy_pass http://alfa-ai-api:8000.
# Public internet traffic must not reach operator/admin/worker routes (public-surface-security).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

upstream alfa_brain {
    server hub;
    keepalive 32;
}

server {
    listen 8000;
    server_name _;

    access_log /var/log/nginx/alfa-ai-edge-access.log;
    error_log  /var/log/nginx/alfa-ai-edge-error.log;

    # Operator / internal routes at brain root -- deny from public site nginx path only.
    # /alfa-ai/* (SPA + /alfa-ai/api/*) is allowed for  admin on host :8420.
    # /mcp is LAN brain :8420 only (MCP inspect); never via this public catch-all.
    location ~ ^/(admin|operator|docs|redoc|openapi\.json|mcp)(/|$) {
        return 404;
    }
    location ~ ^/api/(admin|workers)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://alfa_brain;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}

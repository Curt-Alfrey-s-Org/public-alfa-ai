# LiteLLM — 27B pool production overlay (inference mode)
#
# Activated when brain deploy/.env sets LITELLM_CONFIG=litellm_config.inference.yaml
# (switch-pool-27b.sh). Omits dead speed/Petals tiers while 27B RPC pool is active.
#
# SSoT: docs/GREV27_27B_OPERATOR.md Phase 5

model_list:
  - model_name: "frontier-code"
    litellm_params:
      model: "openai/qwen3.6-27b"
      api_base: "os.environ/LLAMACPP_CODE27_URL"
      api_key: "change-me"
      timeout: 1200
      stream_timeout: 120
      request_timeout: 1200
    model_info:
      supports_reasoning: true
      # Official default: background checks probe via chat completion, not backend /health.
      # They race coordinator model load (503) and poison routing cooldowns.
      # See https://docs.litellm.ai/docs/proxy/health
      disable_background_health_check: true

  - model_name: "frontier"
    litellm_params:
      model: "openai/qwen3.6-27b"
      api_base: "os.environ/LLAMACPP_CODE27_URL"
      api_key: "change-me"
      timeout: 1200
      stream_timeout: 120
      request_timeout: 1200
    model_info:
      supports_reasoning: true
      disable_background_health_check: true

  - model_name: "qwen3.6-27b"
    litellm_params:
      model: "openai/qwen3.6-27b"
      api_base: "os.environ/LLAMACPP_CODE27_URL"
      api_key: "change-me"
      timeout: 1200
      stream_timeout: 120
      request_timeout: 1200
    model_info:
      supports_reasoning: true
      disable_background_health_check: true

  # Draft coder (learning-loop L3) — standalone 7B on gaming-c when LLAMACPP_7B_URL is set.
  # Unset LLAMACPP_7B_URL -> falls back to inference stub (same as frontier-code).
  # Not production default; do not set DEFAULT_MODEL to this alias.
  # Docs: docs/operations/ALFA_7B_SERVE_ALONGSIDE_27B.md
  - model_name: "alfa-coder-draft"
    litellm_params:
      model: "openai/qwen2.5-coder-7b"
      api_base: "os.environ/LLAMACPP_7B_URL"
      api_key: "change-me"
      timeout: 600
      stream_timeout: 120
      request_timeout: 600
    model_info:
      supports_reasoning: false
      disable_background_health_check: true
      description: "Home 7B QLoRA on gaming-c:8470 when LLAMACPP_7B_URL set"

  # -- Universal alias coverage (see docs/POOL_SWITCH_OPERATOR.md) -------------
  # Same generic aliases client repos (rankings-bot, market-pie5-bot, etc.) call
  # in pool35 mode, routed to the live 27B model here so no client integration
  # sees "Invalid model name" just because inference is the active pool.
  - model_name: "fast"
    litellm_params:
      model: "openai/qwen3.6-27b"
      api_base: "os.environ/LLAMACPP_CODE27_URL"
      api_key: "change-me"

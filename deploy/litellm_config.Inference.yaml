general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  # Official default is false; inference uses orchestrator keep-warm + post-start verify instead.
  # background_health_checks probe chat completions during coordinator cold load (503).
  background_health_checks: false
  health_check_interval: 60
  enable_health_check_routing: true
  health_check_ignore_transient_errors: true
  health_check_skip_disabled_background_models: true

litellm_settings:
  drop_params: false
  set_verbose: false
  request_timeout: 600
  num_retries: 1
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    ttl: 3600
    supported_call_types:
      - acompletion
      - aembedding

router_settings:
  timeout: 900
  # Redact internal model_group/fallback alias names from client-visible error
  # bodies (public-surface-security.mdc). Requires LiteLLM >= v1.90.
  # See https://docs.litellm.ai/release_notes/v1.90.0/v1-90-0
  expose_router_debug_in_errors: false
  routing_strategy: "latency-based-routing"
  cooldown_time: 120
  allowed_fails: 1
  allowed_fails_policy:
    TimeoutErrorAllowedFails: 3
    RateLimitErrorAllowedFails: 2
    InternalServerErrorAllowedFails: 2
  retry_policy:
    RateLimitErrorRetries: 0
  fallbacks:
    - frontier-code: []
    - frontier: []
    - qwen3.6-27b: []
    - fast: []
    - inline: []
    - autocomplete: []
    - chat: []
    - public-chat: []
    - app-chat: []
    - agent: []
    - code: []
    - operator_internal: []
    - qwen3.6:35b-a3b: []
    # 7B down or LLAMACPP_7B_URL unset: fail over to inference (not for draft+judge dual-check)
    - alfa-coder-draft: ["frontier-code"]

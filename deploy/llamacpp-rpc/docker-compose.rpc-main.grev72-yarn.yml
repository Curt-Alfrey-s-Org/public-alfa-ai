# GREV72: YaRN on the llama-server command line (not env-only).
#
# Why CLI + override-kv:
# 1) LLAMA_ARG_ROPE_* alone left /props n_ctx at train 32768 (2026-08-09).
# 2) --rope-scaling yarn on argv still left n_ctx=32768 (2026-08-10 start fail):
#    llama-server caps slot n_ctx to GGUF context_length unless metadata is raised.
#    Maintainer workaround (llama.cpp #17459): --override-kv <arch>.context_length=...
#    Qwen2.5 arch keys: qwen2.context_length / qwen2.rope.scaling.* (PR #10698).
# Official server flags:
#   https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md
# HF long context: https://huggingface.co/Qwen/Qwen2.5-72B-Instruct#processing-long-texts
#
# Included only by deploy-grev72-pool-coordinator.sh when ROPE_SCALING_TYPE is set.
# Replaces `command` (Compose does not merge command arrays). Keep in sync with
# docker-compose.rpc-main.grev27-pool-coordinator.yml plus YaRN + override-kv.
# Values from .env.rpc (write-grev72-pool-env.sh).

services:
  llamacpp-server:
    environment:
      LLAMA_ARG_ROPE_SCALING_TYPE: ${ROPE_SCALING_TYPE}
      LLAMA_ARG_ROPE_SCALE: ${ROPE_SCALE}
      LLAMA_ARG_YARN_ORIG_CTX: ${YARN_ORIG_CTX}
    command:
      - llama-server
      - --host
      - "0.0.0.0"
      - --port
      - "${MAIN_PORT:-31360}"
      - --model
      - "/models/${MODEL_FILE:-qwen2.5-72b-instruct-q4_k_m-00001-of-00012.gguf}"
      - --alias
      - "${MODEL_ALIAS:-qwen2.5-72b}"
      - --ctx-size
      - "${CTX_SIZE:-131072}"
      - --rope-scaling
      - "${ROPE_SCALING_TYPE:-yarn}"
      - --rope-scale
      - "${ROPE_SCALE:-4}"
      - --yarn-orig-ctx
      - "${YARN_ORIG_CTX:-32768}"
      - --override-kv
      - "qwen2.context_length=int:${CTX_SIZE:-131072},qwen2.rope.scaling.type=str:yarn,qwen2.rope.scaling.factor=float:${ROPE_SCALE:-4},qwen2.rope.scaling.original_context_length=int:${YARN_ORIG_CTX:-32768}"
      - --batch-size
      - "${BATCH_SIZE:-4096}"
      - --ubatch-size
      - "${UBATCH_SIZE:-512}"
      - --cache-type-k
      - "${CACHE_TYPE_K:-q4_0}"
      - --cache-type-v
      - "${CACHE_TYPE_V:-q4_0}"
      - --n-gpu-layers
      - "${N_GPU_LAYERS:-999}"
      - --tensor-split
      - "${TENSOR_SPLIT:-11,6.5,5,9,9,9.5,5.5,4.0,2.5}"
      - --split-mode
      - layer
      - --main-gpu
      - "0"
      - --flash-attn
      - "on"
      - --no-warmup
      - --fit
      - off
      - --no-mmap
      - --rpc
      - "${RPC_BACKENDS:?RPC_BACKENDS must be set in .env.rpc}"
      - --jinja
      - --chat-template
      - "${CHAT_TEMPLATE:-chatml}"
      - --parallel
      - "${PARALLEL:-1}"
      - --threads-http
      - "${THREADS_HTTP:-64}"
      - --cache-reuse
      - "${CACHE_REUSE:-256}"
      # Prompt-cache save aborts on RPC-owned KV (upstream #26128); keep 0.
      - --cache-ram
      - "${CACHE_RAM:-0}"
      - --slot-save-path
      - "/slot-cache"

# SPA static server — audit VITE-003–005 / backlog #20 (split-frontend image).
#
# Security headers per the nginx headers module docs. add_header directives are
# inherited from the previous level ONLY if the current level defines none, so
# they are re-declared inside every location that sets its own add_header.
# https://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location ~* \.(js|css|woff2?|svg|png|jpe?g|ico|webp|map)$ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
